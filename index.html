</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><div class="shell"><div class="gold">✦ FAMILY TRAVEL PLANNER</div><h1>London Trip 2026 🇬🇧</h1><div>23–29 באוקטובר · שבוע של הרפתקאות בלונדון</div><div class="muted">יומן · תמונות · מפה · ניווט · עריכה</div></div></header><main class="shell"><nav id="days"></nav><div class="grid"><div class="stat"><div class="muted">יום בטיול</div><strong id="dayName"></strong></div><div class="stat"><div class="muted">מספר תחנות</div><strong id="count"></strong></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:17px 0"><button class="primary" onclick="addEvent()">＋ פעילות</button><button onclick="exportData()">ייצוא ושיתוף</button><button onclick="document.getElementById('importer').click()">ייבוא מסלול</button><input hidden type="file" id="importer" accept="application/json" onchange="importData(this)"></div><h2 id="heading"></h2><div class="cards" id="cards"></div><h2>🗺️ מפת היום</h2><div class="panel"><div id="map"></div><div class="actions"><button onclick="routeDay('walking')">🚶 מסלול הליכה ב־Google Maps</button><button onclick="routeDay('transit')">🚇 תחבורה ציבורית</button></div></div><div class="footer">השינויים נשמרים במכשיר הזה. כדי להעביר למשפחה השתמשו בייצוא ובייבוא. התמונות והמפה דורשות אינטרנט.</div></main><dialog id="editor"><form id="editform" onsubmit="saveEvent(event)"><h2 id="editTitle">עריכת פעילות</h2><label>שם הפעילות<input name="title" required></label><label>יום<select name="day" id="daySelect"></select></label><label>שעת התחלה<input name="time" type="time" required></label><label>שעת סיום<input name="end" type="time" required></label><label>כתובת / שם מקום<input name="place"></label><label>קישור לתמונה<input name="photo" type="url"></label><label>מצב הזמנה<select name="status"><option value="planned">מתוכנן</option><option value="booked">הוזמן</option><option value="optional">אופציונלי</option></select></label><label>הערות<input name="no
