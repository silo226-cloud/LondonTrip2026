name: Build Charging Monitor APK
on:
  push:
    paths:
      - "charging-monitor/**"
      - ".github/workflows/charging-monitor.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charging-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ChargeMonitor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ChargeMonitor-apk
          path: charging-monitor/ChargeMonitor.apk
      - name: Publish to "charging-monitor-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: charging-monitor-latest
          name: מד טעינה – גרסה אחרונה
          prerelease: true
          files: charging-monitor/ChargeMonitor.apk
          body: |
            הורידו את ChargeMonitor.apk לטלפון האנדרואיד והתקינו (יש לאשר "התקנה ממקורות לא ידועים").
            נבנה מהקומיט ${{ github.sha }}.
